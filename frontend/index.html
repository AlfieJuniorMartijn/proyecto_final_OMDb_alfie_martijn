<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Search</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* A star is a grey star with a black star on top of it.
       The black one is cut off at 0%, 50% or 100% width: empty, half or full star. */
    .star { position: relative; display: inline-block; font-size: 1.4rem; line-height: 1; color: #ced4da; }
    .star .fill { position: absolute; left: 0; top: 0; overflow: hidden; color: #212529; }

    /* Bigger, clickable stars in the form */
    .star-input .star { font-size: 2rem; cursor: pointer; }

    /* Small stars next to each comment */
    .stars-sm .star { font-size: 1rem; }
  </style>
</head>
<body class="bg-light">

  <!-- Page title -->
  <header class="bg-dark text-white text-center py-4 mb-4">
    <h1 class="display-5 fw-bold mb-1">Movie Search</h1>
    <p class="text-white-50 mb-0">Find any movie by title and year</p>
  </header>

  <main class="container" style="max-width: 720px;">


    <form id="SearchForm" class="d-flex gap-3" role="search">

      <button class="btn btn-success px-4" type="submit">Search</button>

      <div class="flex-grow-1 d-flex flex-column gap-2">
        <!-- Title bar -->
        <div class="navbar bg-body-tertiary rounded-3 px-3 shadow-sm">
          <input class="form-control" type="search" id="SearchTitleInput"
                 placeholder="Search for title" aria-label="Title"/>
        </div>

        <!-- Year bar -->
        <div class="navbar bg-body-tertiary rounded-3 px-3 shadow-sm">
          <input class="form-control" type="number" id="SearchYearInput"
                 placeholder="Search for year (optional)" aria-label="Year" min="1880" max="2100"/>
        </div>
      </div>

    </form>

    <!-- Results: cards stacked one beneath the other -->
    <div id="results" class="d-flex flex-column gap-3 mt-4 mb-5"></div>

  </main>

  <!-- Side box for comments (hidden at first) -->
<div id="commentsBox" class="d-none position-fixed top-0 end-0 h-100 bg-white shadow p-3 overflow-auto"
     style="width: 380px;">

  <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
    <h5 id="commentsTitle" class="mb-0">Comments</h5>
    <button id="closeComments" class="btn-close"></button>
  </div>

  <!-- Reviews summary: average, stars and bars (filled in by JavaScript) -->
  <div id="reviewSummary"></div>

  <div id="commentsList"></div>

  <form id="commentForm" class="border-top pt-3 mt-3">
    <h6>Add your review</h6>
    <input id="commentName" class="form-control mb-2" placeholder="Your name" required>
    <!-- Clickable stars: left half of a star = half star -->
    <div id="starInput" class="star-input"></div>
    <div id="starInputLabel" class="small text-body-secondary mb-2">Click a star to rate</div>
    <textarea id="commentText" class="form-control mb-2" rows="3" placeholder="Your comment" required></textarea>
    <button type="submit" class="btn btn-success w-100">Post comment</button>
  </form>
</div>

  <script src="js/app.js"></script>
</body>
</html>
